<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Coin Circle (Outer Ring) -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#6366F1" stroke-width="8"/>
  
  <!-- Inner Coin Detail -->
  <circle cx="100" cy="100" r="65" fill="#EEF2FF"/>
  
  <!-- Dollar/Currency Symbol -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#6366F1" text-anchor="middle">₹</text>
  
  <!-- Subtle shine effect -->
  <circle cx="120" cy="80" r="15" fill="white" opacity="0.3"/>
</svg>