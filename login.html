<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b1d2a;
color:white;
font-family:Arial;
}

.container{
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:10px;
text-align:center;
}

input{
display:block;
margin:10px 0;
padding:8px;
width:200px;
}

button{
padding:8px 20px;
}

</style>

</head>
<body>

<div class="container">

<h2>Login</h2>

<form id="loginForm">

<input type="email" id="email" placeholder="Enter Email" required>

<input type="password" id="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have account? <a href="signup.html">Signup</a></p>

</div>

<script src="js/auth.js"></script>

</body>
</html>
