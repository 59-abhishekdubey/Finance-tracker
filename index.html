<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- SIDEBAR (Desktop Navigation) -->
<aside id="sidebar" style="display: none;">
    <!-- Brand/Logo -->
    <div class="sidebar-brand">
        <span class="sidebar-brand-icon">🪙</span>
        <span class="sidebar-brand-text">Finance Tracker</span>
    </div>
    
    <!-- Navigation -->
    <nav class="sidebar-nav">
        <!-- Main Navigation -->
        <div class="sidebar-section">
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a class="sidebar-link active" onclick="navigateTo('home')" data-screen="home">
                        <span class="sidebar-icon">🏠</span>
                        <span class="sidebar-text">Dashboard</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="navigateTo('stats')" data-screen="stats">
                        <span class="sidebar-icon">📊</span>
                        <span class="sidebar-text">Statistics</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="navigateTo('analytics')" data-screen="analytics">
                        <span class="sidebar-icon">📈</span>
                        <span class="sidebar-text">Analytics</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="navigateTo('ai')" data-screen="ai">
                        <span class="sidebar-icon">💬</span>
                        <span class="sidebar-text">AI Advisor</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <!-- Preferences -->
        <div class="sidebar-section">
            <div class="sidebar-section-title">Preferences</div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a class="sidebar-link" onclick="navigateTo('settings')" data-screen="settings">
                        <span class="sidebar-icon">⚙️</span>
                        <span class="sidebar-text">Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- User Profile (Footer) -->
    <div class="sidebar-footer">
        <div class="sidebar-user" onclick="navigateTo('profile')">
            <div class="sidebar-user-avatar" id="sidebar-avatar">
                👤
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebar-username">User</div>
                <div class="sidebar-user-role">Free Plan</div>
            </div>
        </div>
    </div>
</aside>

<!-- Mobile Overlay (for sidebar) -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

<!-- Hamburger Menu (Mobile) -->
<button class="hamburger-btn" id="hamburger-btn" onclick="toggleMobileSidebar()">
    <span class="hamburger-icon">☰</span>
</button>

<!-- Desktop Header -->
<header id="header" style="display: none;">
    <!-- Nayan will build this -->
</header>

<!-- Rest of your existing HTML below... -->

    <div id="app">
        <!-- App content will be rendered here -->
    </div>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/components.js"></script>
    <script src="js/ai-chat.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
